[launcher]
; The games folder is given on the command line: python main.py [GAMES_DIR]

; Python interpreter used to run programs (blank = same as the launcher).
python =

; Font size of the list text.
font_size = 50

; Font size of the selected game's description (README.md or "Play ...").
description_font_size = 50

; Font size of error messages shown after a program fails.
error_font_size = 28

; Speed at which the list slides to keep the selection centred (rows/second).
scroll_speed = 10
