[launcher]
; Directory containing the programs to list. Relative paths are resolved
; against the launcher's own directory. Each sub-directory containing a
; main.py is listed (by folder name); anything else is ignored.
script_dir = games

; Python interpreter used to run programs (blank = same as the launcher).
python =

; Font size of the list text.
font_size = 50

; Speed at which the list slides to keep the selection centred (rows/second).
scroll_speed = 10
